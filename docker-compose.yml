# Levanta el backend escuchando SOLO en 127.0.0.1 del host.
# La exposición a Internet la hace el reverse proxy (deploy/caddy o deploy/nginx).
#
#   docker compose up -d --build        # backend solo (recomendado con Caddy del host)
#   docker compose --profile edge up -d # backend + Caddy en contenedor (80/443)

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      TEG_HOST: 0.0.0.0            # dentro del contenedor; el host solo publica loopback
      TEG_DB_PATH: /app/data/teg.db
      TEG_MEDIA_DIR: /app/data/media
      # el comentarista usa el Ollama del host (GPU); claude-cli no existe en
      # el contenedor, la cadena degrada sola a ollama → plantillas
      TEG_OLLAMA_URL: http://host.docker.internal:11434
      TEG_OLLAMA_MODEL: ${TEG_OLLAMA_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${TEG_PORT:-8123}:8123"
    volumes:
      - ./data:/app/data
      - ./docs/playtest:/app/docs/playtest
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # el contenedor murio con SIGKILL (137) porque el grace period de 10 s no
    # alcanzo para cerrar las dos conexiones SQLite: quedaron WAL sucios de 4 MB
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    # nginx sirve la SPA y proxya /api, /health y /ws al backend
    ports:
      - "127.0.0.1:${TEG_FRONTEND_PORT:-8130}:80"
    stop_grace_period: 15s
    mem_limit: 256m
    cpus: 0.5

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    depends_on: [frontend]
    # SOLO 443: el puerto 80 del host lo ocupa Apache (Nextcloud) y no se toca.
    # Caddy obtiene el certificado por TLS-ALPN-01 (no necesita el 80).
    ports:
      - "443:443"
    environment:
      TEG_DOMAIN: ${TEG_DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
