<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" id="map-base-tactical-100-001">
  <defs>
    <style>
      .territory {
        fill: rgba(22, 27, 34, 0.7);
        stroke: #0b1220;
        stroke-width: 3;
        stroke-linejoin: round;
        cursor: pointer;
        transition: fill 0.15s ease;
      }
      .territory:hover {
        stroke: #00b4d8; /* Cian Fósforo al hover */
      }
    </style>
    <radialGradient id="ocean-grad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0e2a47" />
      <stop offset="60%" stop-color="#0a1e35" />
      <stop offset="100%" stop-color="#060f1d" />
    </radialGradient>
    <pattern id="ocean-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="rgba(96, 165, 250, 0.06)" stroke-width="1.5" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="2560" height="1440" fill="url(#ocean-grad)" />
  <rect x="0" y="0" width="2560" height="1440" fill="url(#ocean-grid)" />
  <!-- Ejemplo de subdivisiones -->
  <g id="continent-south-america-extended">
    <path id="territory-south-america-patagonia" class="territory" d="M 530 1200 L 580 1190 L 560 1280 L 510 1270 Z" />
    <path id="territory-south-america-argentina-norte" class="territory" d="M 540 1100 L 610 1080 L 600 1190 L 530 1200 Z" />
  </g>
</svg>
