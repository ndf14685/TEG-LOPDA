    <!-- Francia -->
    <path id="territory-europe-france" class="territory" 
      d="M 1180 390 C 1240 370, 1310 360, 1340 410 C 1360 470, 1320 530, 1250 550 C 1190 540, 1170 470, 1180 390 Z" />
