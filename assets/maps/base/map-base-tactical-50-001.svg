<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" id="map-base-tactical-50-001">
  <defs>
    <style>
      .territory {
        fill: rgba(30, 35, 45, 0.85);
        stroke: #0b1220;
        stroke-width: 4;
        stroke-linejoin: round;
        cursor: pointer;
        transition: fill 0.2s ease, stroke 0.2s ease, filter 0.2s ease;
      }
      .territory:hover {
        stroke: #38bdf8;
        filter: brightness(1.25);
      }
      .territory.selected {
        stroke: #fbbf24;
        stroke-width: 4;
        filter: brightness(1.35);
      }
      .territory.attack-source {
        stroke: #38bdf8;
        stroke-width: 4;
      }
      .territory.attack-target {
        stroke: #ef4444;
        stroke-width: 4;
        stroke-dasharray: 8 4;
      }
      .territory-label {
        fill: #f1f5f9;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 34px;
        font-weight: 700;
        paint-order: stroke;
        stroke: rgba(2, 6, 23, 0.8);
        stroke-width: 7px;
        stroke-linejoin: round;
        pointer-events: none;
        text-anchor: middle;
        user-select: none;
      }
      .continent-title {
        fill: rgba(148, 163, 184, 0.55);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: 3px;
        pointer-events: none;
        text-anchor: middle;
        text-transform: uppercase;
      }
    </style>
    <radialGradient id="ocean-grad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0e2a47" />
      <stop offset="60%" stop-color="#0a1e35" />
      <stop offset="100%" stop-color="#060f1d" />
    </radialGradient>
    <pattern id="ocean-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="rgba(96, 165, 250, 0.06)" stroke-width="1.5" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="2560" height="1440" fill="url(#ocean-grad)" />
  <rect x="0" y="0" width="2560" height="1440" fill="url(#ocean-grid)" />

  <!-- AMÉRICA DEL SUR -->
  <g id="continent-south-america">
    <text x="650" y="780" class="continent-title">América del Sur</text>
    <path id="territory-south-america-colombia" class="territory" d="M 540 820 L 660 800 L 640 920 L 530 900 Z" />
    <path id="territory-south-america-peru" class="territory" d="M 530 900 L 640 920 L 620 1040 L 510 1020 Z" />
    <path id="territory-south-america-brazil" class="territory" d="M 660 800 L 840 820 L 860 1000 L 620 1040 L 640 920 Z" />
    <path id="territory-south-america-chile" class="territory" d="M 510 1020 L 590 1030 L 560 1320 L 490 1300 Z" />
    <path id="territory-south-america-argentina" class="territory" d="M 590 1030 L 740 1010 L 720 1340 L 560 1320 Z" />
    <text x="590" y="865" class="territory-label">Colombia</text>
    <text x="575" y="975" class="territory-label">Perú</text>
    <text x="740" y="920" class="territory-label">Brasil</text>
    <text x="535" y="1170" class="territory-label">Chile</text>
    <text x="650" y="1175" class="territory-label">Argentina</text>
  </g>

  <!-- AMÉRICA DEL NORTE -->
  <g id="continent-north-america">
    <text x="480" y="130" class="continent-title">América del Norte</text>
    <path id="territory-north-america-alaska" class="territory" d="M 220 180 L 420 170 L 400 340 L 200 350 Z" />
    <path id="territory-north-america-canada" class="territory" d="M 420 170 L 780 160 L 760 420 L 400 340 Z" />
    <path id="territory-north-america-usa" class="territory" d="M 400 340 L 760 420 L 740 620 L 380 540 Z" />
    <path id="territory-north-america-mexico" class="territory" d="M 380 540 L 740 620 L 660 800 L 540 820 Z" />
    <text x="310" y="265" class="territory-label">Alaska</text>
    <text x="590" y="290" class="territory-label">Canadá</text>
    <text x="570" y="480" class="territory-label">EE. UU.</text>
    <text x="580" y="700" class="territory-label">México</text>
  </g>

  <!-- EUROPA -->
  <g id="continent-europe">
    <text x="1300" y="200" class="continent-title">Europa</text>
    <path id="territory-europe-uk" class="territory" d="M 1050 250 L 1180 240 L 1170 380 L 1040 390 Z" />
    <path id="territory-europe-france" class="territory" d="M 1080 390 L 1240 380 L 1220 520 L 1060 530 Z" />
    <path id="territory-europe-spain" class="territory" d="M 1060 530 L 1220 520 L 1200 660 L 1040 670 Z" />
    <path id="territory-europe-germany" class="territory" d="M 1240 380 L 1400 370 L 1380 510 L 1220 520 Z" />
    <path id="territory-europe-russia" class="territory" d="M 1400 370 L 1650 350 L 1630 600 L 1380 510 Z" />
    <text x="1110" y="320" class="territory-label">Reino Unido</text>
    <text x="1150" y="455" class="territory-label">Francia</text>
    <text x="1130" y="600" class="territory-label">España</text>
    <text x="1310" y="445" class="territory-label">Alemania</text>
    <text x="1515" y="485" class="territory-label">Rusia</text>
  </g>

  <!-- ÁFRICA -->
  <g id="continent-africa">
    <text x="1240" y="630" class="continent-title">África</text>
    <path id="territory-africa-sahara" class="territory" d="M 1040 670 L 1280 660 L 1260 920 L 1020 930 Z" />
    <path id="territory-africa-egypt" class="territory" d="M 1280 660 L 1500 650 L 1480 900 L 1260 920 Z" />
    <path id="territory-africa-congo" class="territory" d="M 1020 930 L 1480 900 L 1440 1140 L 1000 1150 Z" />
    <path id="territory-africa-south-africa" class="territory" d="M 1000 1150 L 1440 1140 L 1400 1340 L 980 1330 Z" />
    <text x="1150" y="800" class="territory-label">Sáhara</text>
    <text x="1380" y="785" class="territory-label">Egipto</text>
    <text x="1235" y="1025" class="territory-label">Congo</text>
    <text x="1205" y="1245" class="territory-label">Sudáfrica</text>
  </g>

  <!-- ASIA -->
  <g id="continent-asia">
    <text x="1950" y="280" class="continent-title">Asia</text>
    <path id="territory-asia-middle-east" class="territory" d="M 1480 650 L 1750 640 L 1730 840 L 1460 850 Z" />
    <path id="territory-asia-india" class="territory" d="M 1750 640 L 1980 630 L 1950 880 L 1730 840 Z" />
    <path id="territory-asia-china" class="territory" d="M 1980 630 L 2250 610 L 2220 860 L 1950 880 Z" />
    <path id="territory-asia-siberia" class="territory" d="M 1650 350 L 2100 330 L 2070 620 L 1630 600 Z" />
    <path id="territory-asia-kamchatka" class="territory" d="M 2100 330 L 2380 320 L 2350 580 L 2070 620 Z" />
    <path id="territory-asia-japan" class="territory" d="M 2250 610 L 2420 600 L 2400 780 L 2220 860 Z" />
    <text x="1605" y="750" class="territory-label">Oriente Medio</text>
    <text x="1855" y="760" class="territory-label">India</text>
    <text x="2100" y="745" class="territory-label">China</text>
    <text x="1860" y="475" class="territory-label">Siberia</text>
    <text x="2225" y="470" class="territory-label">Kamchatka</text>
    <text x="2320" y="735" class="territory-label">Japón</text>
  </g>

  <!-- OCEANÍA -->
  <g id="continent-oceania">
    <text x="2210" y="890" class="continent-title">Oceanía</text>
    <path id="territory-australia-western" class="territory" d="M 2000 930 L 2220 920 L 2200 1300 L 1980 1310 Z" />
    <path id="territory-australia-eastern" class="territory" d="M 2220 920 L 2440 910 L 2420 1290 L 2200 1300 Z" />
    <text x="2100" y="1115" class="territory-label">Australia O.</text>
    <text x="2320" y="1105" class="territory-label">Australia E.</text>
  </g>
</svg>
