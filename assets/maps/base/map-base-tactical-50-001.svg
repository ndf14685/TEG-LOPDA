    <!-- Rusia -->
    <path id="territory-europe-russia" class="territory" 
      d="M 1510 230 C 1620 210, 1750 200, 1800 270 C 1830 370, 1790 520, 1710 580 C 1600 590, 1500 550, 1480 470 C 1490 410, 1510 350, 1510 230 Z" />
    <text x="1635" y="340" class="territory-label">Rusia</text>
  </g>

  <!-- 4. ÁFRICA -->
  <g id="continent-africa">
    <text x="1260" y="650" class="continent-title">África</text>

    <!-- Sáhara -->
    <path id="territory-africa-sahara" class="territory" 
      d="M 1000 690 C 1120 670, 1260 660, 1310 720 C 1330 800, 1290 890, 1210 920 C 1100 920, 1000 870, 980 790 C 980 730, 990 700, 1000 690 Z" />
    <text x="1140" y="750" class="territory-label">Sáhara</text>

    <!-- Egipto -->
    <path id="territory-africa-egypt" class="territory" 
      d="M 1310 660 C 1420 640, 1530 630, 1560 700 C 1580 790, 1520 880, 1440 900 C 1350 890, 1310 800, 1310 720 C 1260 660, 1310 660, 1310 660 Z" />
    <text x="1430" y="730" class="territory-label">Egipto</text>

    <!-- Congo -->
    <path id="territory-africa-congo" class="territory" 
      d="M 1000 920 C 1150 920, 1440 900, 1480 960 C 1500 1060, 1430 1160, 1320 1180 C 1180 1180, 1000 1130, 970 1040 C 970 970, 990 930, 1000 920 Z" />
    <text x="1220" y="990" class="territory-label">Congo</text>

    <!-- Sudáfrica -->
