      d="M 970 1130 C 1150 1130, 1380 1130, 1420 1190 C 1450 1280, 1380 1370, 1240 1390 C 1080 1380, 950 1310, 930 1220 C 940 1160, 950 1140, 970 1130 Z" />
    <text x="1180" y="1210" class="territory-label">Sudáfrica</text>
  </g>

  <!-- 5. ASIA -->
  <g id="continent-asia">
    <text x="2020" y="150" class="continent-title">Asia</text>

    <!-- Oriente Medio -->
    <path id="territory-asia-middle-east" class="territory" 
      d="M 1520 630 C 1630 610, 1750 600, 1790 670 C 1810 760, 1750 850, 1660 870 C 1560 860, 1490 790, 1500 710 C 1510 660, 1515 640, 1520 630 Z" />
    <text x="1640" y="690" class="territory-label">Oriente Medio</text>

    <!-- India -->
    <path id="territory-asia-india" class="territory" 
      d="M 1790 600 C 1880 590, 1990 580, 2020 660 C 2040 770, 1970 880, 1870 900 C 1780 880, 1730 800, 1750 720 C 1770 650, 1780 615, 1790 600 Z" />
    <text x="1880" y="675" class="territory-label">India</text>

    <!-- China -->
    <path id="territory-asia-china" class="territory" 
      d="M 1990 580 C 2100 560, 2260 550, 2300 630 C 2320 740, 2240 860, 2120 880 C 2010 870, 1960 780, 1970 690 C 1980 630, 1985 595, 1990 580 Z" />
    <text x="2130" y="660" class="territory-label">China</text>

    <!-- Siberia -->
    <path id="territory-asia-siberia" class="territory" 
      d="M 1750 200 C 1900 180, 2120 170, 2180 250 C 2210 360, 2160 510, 2060 570 C 1920 570, 1800 530, 1770 440 C 1760 330, 1750 250, 1750 200 Z" />
    <text x="1950" y="310" class="territory-label">Siberia</text>

    <!-- Kamchatka -->
    <path id="territory-asia-kamchatka" class="territory" 
      d="M 2180 170 C 2300 160, 2440 150, 2480 230 C 2510 340, 2460 490, 2360 550 C 2240 550, 2160 470, 2170 370 C 2175 270, 2175 200, 2180 170 Z" />
    <text x="2320" y="280" class="territory-label">Kamchatka</text>

    <!-- Japón -->
    <path id="territory-asia-japan" class="territory" 
      d="M 2330 570 C 2390 560, 2460 550, 2490 610 C 2510 690, 2470 770, 2400 790 C 2340 780, 2310 720, 2315 660 C 2320 610, 2325 585, 2330 570 Z" />
    <text x="2400" y="625" class="territory-label">Japón</text>
  </g>

  <!-- 6. OCEANÍA -->
  <g id="continent-oceania">
    <text x="2210" y="870" class="continent-title">Oceanía</text>

    <!-- Australia Occidental -->
    <path id="territory-australia-western" class="territory" 
      d="M 1970 930 C 2080 910, 2220 900, 2240 970 C 2260 1080, 2210 1280, 2110 1320 C 2000 1310, 1940 1210, 1945 1090 C 1950 1000, 1960 950, 1970 930 Z" />
    <text x="2080" y="1020" class="territory-label">Australia O.</text>

    <!-- Australia Oriental -->
    <path id="territory-australia-eastern" class="territory" 
      d="M 2240 900 C 2350 880, 2470 870, 2490 950 C 2510 1070, 2460 1270, 2360 1300 C 2250 1290, 2200 1180, 2210 1070 C 2220 980, 2230 920, 2240 900 Z" />
    <text x="2350" y="1000" class="territory-label">Australia E.</text>
  </g>
</svg>
