<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" id="map-base-tactical-50-001">
  <defs>
    <style>
      .territory {
        fill: rgba(30, 41, 59, 0.85);
        stroke: #0f172a;
        stroke-width: 4.5;
        stroke-linejoin: round;
        stroke-linecap: round;
        cursor: pointer;
        transition: fill 0.2s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.2s cubic-bezier(0.4, 0, 0.2, 1), filter 0.2s ease;
      }
      .territory:hover {
        stroke: #38bdf8;
        stroke-width: 5;
        filter: brightness(1.3) drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
      }
      .territory.selected {
        stroke: #fbbf24;
        stroke-width: 5.5;
        filter: brightness(1.4) drop-shadow(0 0 12px rgba(251, 191, 36, 0.6));
      }
      .territory.attack-source {
        stroke: #0284c7;
        stroke-width: 5.5;
        filter: brightness(1.3);
      }
      .territory.attack-target {
        stroke: #ef4444;
        stroke-width: 5.5;
        stroke-dasharray: 10 5;
        filter: brightness(1.3) drop-shadow(0 0 10px rgba(239, 68, 68, 0.6));
      }
      .territory-label {
        fill: #f8fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 800;
        paint-order: stroke;
        stroke: #020617;
        stroke-width: 8px;
        stroke-linejoin: round;
        pointer-events: none;
        text-anchor: middle;
        user-select: none;
        letter-spacing: 0.5px;
      }
      .continent-title {
        fill: rgba(148, 163, 184, 0.45);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 44px;
        font-weight: 900;
        letter-spacing: 4px;
        pointer-events: none;
        text-anchor: middle;
        text-transform: uppercase;
      }
      .sea-route {
        stroke: rgba(56, 189, 248, 0.45);
        stroke-width: 3.5;
        stroke-dasharray: 8 6;
        fill: none;
        pointer-events: none;
      }
    </style>
    <radialGradient id="ocean-grad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="55%" stop-color="#091b30" />
      <stop offset="100%" stop-color="#040a14" />
    </radialGradient>
    <pattern id="ocean-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1.5" />
      <circle cx="120" cy="120" r="2" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>
  </defs>

  <!-- Fondo Océano -->
  <rect x="0" y="0" width="2560" height="1440" fill="url(#ocean-grad)" />
  <rect x="0" y="0" width="2560" height="1440" fill="url(#ocean-grid)" />

  <!-- Rutas Marítimas -->
  <g id="sea-routes">
    <!-- Canadá <-> Alaska <-> UK <-> Kamchatka -->
    <path class="sea-route" d="M 900 230 C 970 240, 1020 260, 1080 300" />
    <path class="sea-route" d="M 1120 400 C 1080 480, 1040 520, 1030 560" />
    <path class="sea-route" d="M 1120 680 C 1120 710, 1140 730, 1160 740" />
    <path class="sea-route" d="M 2300 680 C 2350 670, 2370 660, 2390 650" />
    <path class="sea-route" d="M 2400 350 C 2480 330, 2520 300, 2550 280 M 10 280 C 60 260, 110 240, 180 230" />
    <path class="sea-route" d="M 2180 770 C 2160 840, 2120 900, 2090 970" />
  </g>

  <!-- 1. AMÉRICA DEL SUR -->
  <g id="continent-south-america">
    <text x="750" y="790" class="continent-title">América del Sur</text>
    
    <!-- Colombia -->
    <path id="territory-south-america-colombia" class="territory" 
      d="M 640 840 C 680 825, 750 820, 800 835 C 830 870, 820 920, 780 945 C 730 955, 660 940, 630 900 C 625 870, 630 850, 640 840 Z" />
    <text x="715" y="875" class="territory-label">Colombia</text>

    <!-- Perú -->
    <path id="territory-south-america-peru" class="territory" 
      d="M 630 900 C 660 940, 730 955, 780 945 C 765 1010, 730 1065, 660 1100 C 610 1065, 595 995, 615 930 C 620 915, 625 905, 630 900 Z" />
    <text x="670" y="960" class="territory-label">Perú</text>

    <!-- Brasil -->
    <path id="territory-south-america-brazil" class="territory" 
      d="M 800 835 C 890 830, 990 875, 1010 955 C 1025 1035, 960 1115, 860 1125 C 785 1115, 765 1010, 780 945 C 820 920, 830 870, 800 835 Z" />
    <text x="900" y="940" class="territory-label">Brasil</text>

    <!-- Chile -->
    <path id="territory-south-america-chile" class="territory" 
      d="M 660 1100 C 700 1090, 710 1145, 705 1205 C 695 1285, 665 1365, 605 1375 C 575 1335, 580 1245, 600 1175 C 620 1135, 645 1110, 660 1100 Z" />
    <text x="635" y="1170" class="territory-label">Chile</text>

    <!-- Argentina -->
    <path id="territory-south-america-argentina" class="territory" 
      d="M 780 945 C 765 1010, 785 1115, 860 1125 C 845 1215, 795 1315, 725 1375 C 665 1365, 695 1285, 705 1205 C 710 1145, 700 1090, 660 1100 C 730 1065, 765 1010, 780 945 Z" />
    <text x="765" y="1160" class="territory-label">Argentina</text>
  </g>

  <!-- 2. AMÉRICA DEL NORTE -->
  <g id="continent-north-america">
    <text x="560" y="125" class="continent-title">América del Norte</text>

    <!-- Alaska -->
    <path id="territory-north-america-alaska" class="territory" 
      d="M 180 190 C 230 170, 330 160, 400 180 C 425 220, 415 280, 385 330 C 325 360, 245 370, 195 340 C 165 300, 155 230, 180 190 Z" />
    <text x="285" y="235" class="territory-label">Alaska</text>

    <!-- Canadá -->
    <path id="territory-north-america-canada" class="territory" 
      d="M 400 180 C 530 140, 730 130, 890 170 C 930 230, 910 350, 870 410 C 730 440, 570 420, 385 330 C 415 280, 425 220, 400 180 Z" />
    <text x="640" y="230" class="territory-label">Canadá</text>

    <!-- EE. UU. -->
    <path id="territory-north-america-usa" class="territory" 
      d="M 385 330 C 570 420, 730 440, 870 410 C 900 470, 880 570, 830 630 C 670 660, 490 640, 370 550 C 360 470, 365 390, 385 330 Z" />
    <text x="610" y="450" class="territory-label">EE. UU.</text>

    <!-- México -->
    <path id="territory-north-america-mexico" class="territory" 
      d="M 370 550 C 490 640, 670 660, 830 630 C 810 710, 750 790, 690 830 C 590 850, 500 840, 450 750 C 390 690, 370 610, 370 550 Z" />
    <text x="590" y="675" class="territory-label">México</text>
  </g>

  <!-- 3. EUROPA -->
  <g id="continent-europe">
    <text x="1360" y="170" class="continent-title">Europa</text>

