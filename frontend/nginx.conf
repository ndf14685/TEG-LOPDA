server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta cae en index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # el HTML nunca se cachea: cada deploy debe llegar sin Ctrl+F5
  # (los bundles JS/CSS llevan hash en el nombre, esos sí pueden cachearse)
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # los SVG del mapa no llevan hash: tampoco se cachean para que las
  # iteraciones de arte lleguen sin refresh forzado
  location ~* \.svg$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Backend FastAPI detrás del mismo dominio (servicio "backend" en compose)
  location /api/ {
    proxy_pass http://backend:8123;
    proxy_set_header Host $host;
  }
  location /health {
    proxy_pass http://backend:8123;
  }
  location /ws/ {
    proxy_pass http://backend:8123;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
