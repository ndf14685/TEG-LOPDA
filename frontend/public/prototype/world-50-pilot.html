<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEG LOPDA — Mapamundi 50 Territorios (Modo 50 — 4 Capas)</title>
  <style>
    :root {
      --ocean-navy: #091b30;
      --bg-dark: #040a14;
      --text-main: #f8fafc;
      --border-gold: #d97706;
      --player-red: #ef4444;
      --player-blue: #3b82f6;
      --player-green: #10b981;
      --player-yellow: #eab308;
      --player-purple: #a855f7;
      --player-cyan: #06b6d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #0f172a;
      border-bottom: 2px solid var(--border-gold);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
    }

    .brand-title {
      font-family: serif;
      font-size: 16px;
      font-weight: bold;
      color: #fbbf24;
      letter-spacing: 1.5px;
    }

    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    .btn {
      background: linear-gradient(180deg, #334155, #1e293b);
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #475569; border-color: #fbbf24; }
    .btn-active { border-color: #fbbf24; background: #d97706; color: #000; }

    .map-viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 50% 45%, #0f2b48 0%, #091b30 60%, #040a14 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
    }

    .viewport-container {
      width: 100%;
      height: 100%;
      max-width: 1920px;
      max-height: 1080px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .mode-1366 {
      max-width: 1366px;
      max-height: 768px;
      border: 2px stroke #3b82f6;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.4);
    }

    svg#map-base-tactical-50-001 { width: 100%; height: 100%; }

    .hud-header-bar {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border-bottom: 1px solid var(--border-gold);
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
    }

    .territory-label.hidden-labels { opacity: 0 !important; }
    .badge-group.hidden-badges { opacity: 0 !important; }
    .vector-arrow.hidden-arrow { opacity: 0 !important; }
  </style>
</head>

  <header>
    <div class="brand-title">🗺️ TEG LOPDA — MAPAMUNDI COMPLETO 50 TERRITORIOS (4 CAPAS REALES)</div>
    <div class="toolbar">
      <button class="btn btn-active" id="btn-state-all" onclick="setProofState('all')">👁️ 1. Con Etiquetas y Tropas</button>
      <button class="btn" id="btn-state-notitles" onclick="setProofState('no-labels')">🙈 2. Sin Etiquetas (<1s)</button>
      <button class="btn" id="btn-state-selected" onclick="setProofState('selected')">🎯 3. Seleccionado (Origen)</button>
      <button class="btn" id="btn-state-attackable" onclick="setProofState('attackable')">⚔️ 4. Ataque Posible</button>
      <button class="btn" id="btn-state-executing" onclick="setProofState('executing')">🚀 5. Ataque en Ejecución</button>
      <button class="btn" id="btn-res-1920" onclick="setResolution('1920')">🖥️ 1920x1080</button>
      <button class="btn" id="btn-res-1366" onclick="setResolution('1366')">💻 1366x768</button>
    </div>
  </header>

    <style>
      .territory { fill: rgba(15, 23, 42, 0.75); stroke: #0f172a; stroke-width: 4.5; transition: all 0.2s ease; cursor: pointer; pointer-events: none; }
      .territory.selected { stroke: #ffffff !important; stroke-width: 8 !important; animation: pulseStroke 1.2s infinite alternate; }
      .territory.attack-target { stroke: #ef4444 !important; stroke-width: 8 !important; stroke-dasharray: 10 6; }
      .p-red { stroke: #ef4444; stroke-width: 6; fill: rgba(239, 68, 68, 0.22); filter: drop-shadow(0 0 6px rgba(239,68,68,0.4)); }
      .p-blue { stroke: #3b82f6; stroke-width: 6; fill: rgba(59, 130, 246, 0.22); filter: drop-shadow(0 0 6px rgba(59,130,246,0.4)); }
      .p-green { stroke: #10b981; stroke-width: 6; fill: rgba(16, 185, 129, 0.22); filter: drop-shadow(0 0 6px rgba(16,185,129,0.4)); }
      .p-yellow { stroke: #eab308; stroke-width: 6; fill: rgba(234, 179, 8, 0.22); filter: drop-shadow(0 0 6px rgba(234,179,8,0.4)); }
      .p-purple { stroke: #a855f7; stroke-width: 6; fill: rgba(168, 85, 247, 0.22); filter: drop-shadow(0 0 6px rgba(168,85,247,0.4)); }
      .p-cyan { stroke: #06b6d4; stroke-width: 6; fill: rgba(6, 182, 212, 0.22); filter: drop-shadow(0 0 6px rgba(6,182,212,0.4)); }
      
      /* FORZAR HITBOXES COMO ÚNICO RECEPTOR INTERACTIVO */
      .territory-hitbox { fill: transparent !important; stroke: transparent !important; pointer-events: all !important; cursor: pointer; }
      
      /* FORZAR OVERLAYS COMO 100% INACTIVOS A CLICKS */
      #layer-4-overlays, #layer-4-overlays *, .territory-label, .badge-group, .badge-circle, .badge-text, .vector-arrow {
        pointer-events: none !important;
      }
      .territory-label { font-size: 22px; font-weight: 800; fill: #f8fafc; paint-order: stroke; stroke: #020617; stroke-width: 6px; text-anchor: middle; }
      .badge-circle { fill: #0f172a; fill-opacity: 0.95; stroke-width: 4.5; }
      .badge-text { fill: #fff; font-size: 28px; font-weight: 900; text-anchor: middle; }
      .sea-route { stroke: rgba(56, 189, 248, 0.35); stroke-width: 4; stroke-dasharray: 8 6; fill: none; pointer-events: none; }
      .vector-arrow { stroke: #ef4444; stroke-width: 8; stroke-dasharray: 14 8; fill: none; animation: dashMove 1s linear infinite; }
      @keyframes pulseStroke { 0% { filter: drop-shadow(0 0 6px #fff); } 100% { filter: drop-shadow(0 0 20px #fbbf24); } }
      @keyframes dashMove { to { stroke-dashoffset: -44; } }
    </style>

  <script>
    let currentState = 'all';

    function setProofState(state) {
      currentState = state;
      const labels = document.querySelectorAll('.territory-label');
      const badges = document.querySelectorAll('.badge-group');
      const arg = document.getElementById('territory-south-america-argentina');
      const sah = document.getElementById('territory-africa-sahara');
      const rus = document.getElementById('territory-europe-russia');
      const can = document.getElementById('territory-north-america-canada');

      arg.classList.remove('selected');
      sah.classList.remove('attack-target');
      rus.classList.remove('attack-target');
      can.classList.remove('attack-target');

      document.querySelectorAll('.toolbar .btn').forEach(b => b.classList.remove('btn-active'));
      const activeBtn = document.getElementById(`btn-state-${state}`);
      if (activeBtn) activeBtn.classList.add('btn-active');

      switch(state) {
        case 'all':
          labels.forEach(l => l.classList.remove('hidden-labels'));
          badges.forEach(b => b.classList.remove('hidden-badges'));
          arg.classList.add('selected');
          sah.classList.add('attack-target');
          break;

        case 'no-labels':
          labels.forEach(l => l.classList.add('hidden-labels'));
          badges.forEach(b => b.classList.add('hidden-badges'));
          break;

        case 'selected':
          labels.forEach(l => l.classList.remove('hidden-labels'));
          badges.forEach(b => b.classList.remove('hidden-badges'));
          arg.classList.add('selected');
          break;

        case 'attackable':
          labels.forEach(l => l.classList.remove('hidden-labels'));
          badges.forEach(b => b.classList.remove('hidden-badges'));
          arg.classList.add('selected');
          sah.classList.add('attack-target');
          rus.classList.add('attack-target');
          break;

        case 'executing':
          labels.forEach(l => l.classList.remove('hidden-labels'));
          badges.forEach(b => b.classList.remove('hidden-badges'));
          arg.classList.add('selected');
          sah.classList.add('attack-target');
          break;
      }
    }

    function setResolution(res) {
      const container = document.getElementById('vp-container');
      const btn1920 = document.getElementById('btn-res-1920');
      const btn1366 = document.getElementById('btn-res-1366');

      if (res === '1366') {
        container.classList.add('mode-1366');
        btn1366.classList.add('btn-active');
        btn1920.classList.remove('btn-active');
      } else {
        container.classList.remove('mode-1366');
        btn1920.classList.add('btn-active');
        btn1366.classList.remove('btn-active');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const hitboxes = document.querySelectorAll('.hitbox-path');
      hitboxes.forEach(hb => {
        hb.onclick = (e) => {
          const tid = hb.getAttribute('data-territory-id');
          console.log('Territorio clickeado en Modo 50:', tid);
        };
      });
    });
  </script>
