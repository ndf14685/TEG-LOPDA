<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEG LOPDA — Región Piloto América del Sur (Geometría Realista & 4 Capas)</title>
  <style>
    :root {
      --ocean-navy: #091b30;
      --bg-dark: #040a14;
      --text-main: #f8fafc;
      --border-gold: #d97706;
      --player-red: #ef4444;
      --player-blue: #3b82f6;
      --player-green: #10b981;
      --player-yellow: #eab308;
      --player-purple: #a855f7;
      --player-cyan: #06b6d4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #0f172a;
      border-bottom: 2px solid var(--border-gold);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
    }

    .brand-title {
      font-family: serif;
      font-size: 16px;
      font-weight: bold;
      color: #fbbf24;
      letter-spacing: 1.5px;
    }

    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    .btn {
      background: linear-gradient(180deg, #334155, #1e293b);
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #475569; border-color: #fbbf24; }
    .btn-active { border-color: #fbbf24; background: #d97706; color: #000; }

    .map-viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 50% 45%, #0f2b48 0%, #091b30 60%, #040a14 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
    }

    .viewport-container {
      width: 100%;
      height: 100%;
      max-width: 1920px;
      max-height: 1080px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .mode-1366 {
      max-width: 1366px;
      max-height: 768px;
      border: 2px stroke #3b82f6;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.4);
    }

    svg.pilot-svg { width: 100%; height: 100%; }

    /* Capa 2: Territorios SVG con bordes limpios y tintado sutil */
    .territory {
      fill: rgba(15, 23, 42, 0.75);
      stroke: #0f172a;
      stroke-width: 4.5;
      transition: all 0.2s ease;
    }

    .p-red { stroke: var(--player-red); stroke-width: 6; fill: rgba(239, 68, 68, 0.22); filter: drop-shadow(0 0 6px rgba(239,68,68,0.4)); }
    .p-blue { stroke: var(--player-blue); stroke-width: 6; fill: rgba(59, 130, 246, 0.22); filter: drop-shadow(0 0 6px rgba(59,130,246,0.4)); }
    .p-green { stroke: var(--player-green); stroke-width: 6; fill: rgba(16, 185, 129, 0.22); filter: drop-shadow(0 0 6px rgba(16,185,129,0.4)); }
    .p-yellow { stroke: var(--player-yellow); stroke-width: 6; fill: rgba(234, 179, 8, 0.22); filter: drop-shadow(0 0 6px rgba(234,179,8,0.4)); }
    .p-purple { stroke: var(--player-purple); stroke-width: 6; fill: rgba(168, 85, 247, 0.22); filter: drop-shadow(0 0 6px rgba(168,85,247,0.4)); }
    .p-cyan { stroke: var(--player-cyan); stroke-width: 6; fill: rgba(6, 182, 212, 0.22); filter: drop-shadow(0 0 6px rgba(6,182,212,0.4)); }

    .terr-selected { stroke: #ffffff !important; stroke-width: 8 !important; animation: pulseStroke 1.2s infinite alternate; }
    .terr-target { stroke: #ef4444 !important; stroke-width: 8 !important; stroke-dasharray: 10 6; }

    @keyframes pulseStroke {
      0% { filter: drop-shadow(0 0 6px #fff); }
      100% { filter: drop-shadow(0 0 20px #fbbf24); }
    }

    /* Hitboxes transparentes independientes en Capa 3 */
    .hitbox-path {
      fill: transparent;
      stroke: transparent;
      pointer-events: all;
      cursor: pointer;
    }

    /* Overlays en Capa 4 */
    .territory-label {
      font-size: 24px;
      font-weight: 800;
      fill: #f8fafc;
      paint-order: stroke;
      stroke: #020617;
      stroke-width: 6px;
      text-anchor: middle;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .territory-label.hidden-labels { opacity: 0 !important; }

    .badge-circle { fill: #0f172a; fill-opacity: 0.95; stroke-width: 5; }
    .badge-text { fill: #fff; font-size: 32px; font-weight: 900; text-anchor: middle; }
    .badge-group.hidden-badges { opacity: 0 !important; }

    .vector-arrow {
      stroke: #ef4444;
      stroke-width: 8;
      stroke-dasharray: 14 8;
      fill: none;
      animation: dashMove 1s linear infinite;
      transition: opacity 0.3s ease;
    }
    .vector-arrow.hidden-arrow { opacity: 0 !important; }

    @keyframes dashMove {
      to { stroke-dashoffset: -44; }
    }

    /* HUD ESTRICTO TEG-LOPDA (SIN DATOS FALSOS NI RECURSOS MILITARES DE RTS) */
    .hud-header-bar {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border-bottom: 1px solid var(--border-gold);
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">🗺️ AMÉRICA DEL SUR — GEOMETRÍA REALISTA & 4 CAPAS (TEG-LOPDA)</div>
    <div class="toolbar">
      <button class="btn btn-active" id="btn-state-all" onclick="setProofState('all')">👁️ 1. Con Etiquetas y Tropas</button>
      <button class="btn" id="btn-state-notitles" onclick="setProofState('no-labels')">🙈 2. Sin Etiquetas (<1s)</button>
      <button class="btn" id="btn-state-selected" onclick="setProofState('selected')">🎯 3. Seleccionado (Origen)</button>
      <button class="btn" id="btn-state-attackable" onclick="setProofState('attackable')">⚔️ 4. Ataque Posible</button>
      <button class="btn" id="btn-state-executing" onclick="setProofState('executing')">🚀 5. Ataque en Ejecución</button>
      <button class="btn" id="btn-mode-50" onclick="toggleMode('50')">🗺️ Modo 50 (8 Países)</button>
      <button class="btn" id="btn-mode-26" onclick="toggleMode('26')">🗺️ Modo 26 (5 Países)</button>
      <button class="btn" id="btn-res-1920" onclick="setResolution('1920')">🖥️ 1920x1080</button>
      <button class="btn" id="btn-res-1366" onclick="setResolution('1366')">💻 1366x768</button>
    </div>
  </header>

  <!-- HUD TEG-LOPDA STRICTO -->
  <div class="hud-header-bar">
    <span>🪖 FASE DE ATAQUE TÁCTICO | TURNO: JUGADOR ROJO (LEÓN - ARGENTINA)</span>
    <span>🪙 MONEDAS LOPDA: 450</span>
  </div>

  <div class="map-viewport">
    <div class="viewport-container" id="vp-container">
      <svg class="pilot-svg" viewBox="0 0 2560 1440" id="svg-pilot">
        
        <!-- CAPA 1: BASE GEOGRÁFICA Y OCÉANO NO INTERACTIVO -->
        <g id="layer-1-geo-base">
          <rect width="2560" height="1440" fill="#091b30" />
          <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
            <path d="M 120 0 L 0 0 0 120" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1.5" />
          </pattern>
          <rect width="2560" height="1440" fill="url(#grid)" />

          <!-- Silueta continental de América del Sur y África en el Atlántico -->
          <path d="M 880 320 C 1020 310, 1210 340, 1350 720 C 1310 820, 1180 840, 930 1320 C 800 1250, 790 550, 880 320 Z" fill="#0d233a" stroke="rgba(56,189,248,0.15)" stroke-width="3" />
          <!-- África para el vector de ataque -->
          <path d="M 1600 480 C 1900 420, 2180 500, 2220 750 C 2150 1150, 1850 1280, 1680 1220 C 1580 1020, 1540 750, 1600 480 Z" fill="#0d233a" stroke="rgba(56,189,248,0.15)" stroke-width="3" />
        </g>

        <!-- CAPA 2: TERRITORIOS SVG JUGABLES CON GEOMETRÍA REALISTA ENCASTADA -->
        <g id="layer-2-playable-territories">
          <path id="territory-south-america-colombia" class="territory p-yellow" d="M 880 320 C 920 300, 990 310, 1020 360 L 980 430 C 940 450, 900 440, 860 410 C 850 370, 860 340, 880 320 Z" />
          <path id="territory-south-america-venezuela" class="territory p-cyan mode-50-only" d="M 1020 360 C 1080 330, 1160 340, 1210 370 L 1180 440 C 1120 450, 1040 440, 980 430 Z" />
          <path id="territory-south-america-peru" class="territory p-green" d="M 860 410 C 900 440, 940 450, 950 510 L 920 640 C 860 630, 820 570, 800 490 C 810 450, 830 420, 860 410 Z" />
          <path id="territory-south-america-brazil" class="territory p-blue" d="M 980 430 C 1040 440, 1120 450, 1180 440 C 1270 480, 1360 560, 1350 720 C 1310 820, 1180 840, 1080 790 L 970 700 C 980 620, 960 510, 980 430 Z" />
          <path id="territory-south-america-bolivia" class="territory p-purple mode-50-only" d="M 920 640 C 950 510, 980 620, 970 700 L 1080 790 C 1020 830, 960 840, 920 780 Z" />
          <path id="territory-south-america-chile" class="territory p-yellow" d="M 800 490 C 820 570, 860 630, 920 640 L 920 780 C 890 920, 860 1120, 840 1260 C 810 1250, 800 1100, 800 820 C 790 680, 790 550, 800 490 Z" />
          <path id="territory-south-america-argentina" class="territory p-red terr-selected" d="M 920 780 C 960 840, 1020 830, 1080 790 L 1120 860 C 1080 940, 1010 1100, 930 1320 L 840 1260 C 860 1120, 890 920, 920 780 Z" />
          <path id="territory-south-america-uruguay" class="territory p-green mode-50-only" d="M 1080 790 C 1180 840, 1160 890, 1120 860 Z" />
          
          <!-- África Sáhara Objetivo -->
          <path id="territory-africa-sahara" class="territory p-green" d="M 1650 540 C 1850 510, 1980 580, 2010 740 C 1900 820, 1720 830, 1630 750 Z" />
        </g>

        <!-- CAPA 3: HITBOXES INVISIBLES INDEPENDIENTES (Hover/Click/Drag) -->
        <g id="layer-3-hitboxes">
          <path class="hitbox-path" d="M 880 320 C 920 300, 990 310, 1020 360 L 980 430 C 940 450, 900 440, 860 410 C 850 370, 860 340, 880 320 Z" onclick="selectTerritory('Colombia')" />
          <path class="hitbox-path mode-50-only" d="M 1020 360 C 1080 330, 1160 340, 1210 370 L 1180 440 C 1120 450, 1040 440, 980 430 Z" onclick="selectTerritory('Venezuela')" />
          <path class="hitbox-path" d="M 860 410 C 900 440, 940 450, 950 510 L 920 640 C 860 630, 820 570, 800 490 C 810 450, 830 420, 860 410 Z" onclick="selectTerritory('Perú')" />
          <path class="hitbox-path" d="M 980 430 C 1040 440, 1120 450, 1180 440 C 1270 480, 1360 560, 1350 720 C 1310 820, 1180 840, 1080 790 L 970 700 C 980 620, 960 510, 980 430 Z" onclick="selectTerritory('Brasil')" />
          <path class="hitbox-path mode-50-only" d="M 920 640 C 950 510, 980 620, 970 700 L 1080 790 C 1020 830, 960 840, 920 780 Z" onclick="selectTerritory('Bolivia')" />
          <path class="hitbox-path" d="M 800 490 C 820 570, 860 630, 920 640 L 920 780 C 890 920, 860 1120, 840 1260 C 810 1250, 800 1100, 800 820 C 790 680, 790 550, 800 490 Z" onclick="selectTerritory('Chile')" />
          <path class="hitbox-path" d="M 920 780 C 960 840, 1020 830, 1080 790 L 1120 860 C 1080 940, 1010 1100, 930 1320 L 840 1260 C 860 1120, 890 920, 920 780 Z" onclick="selectTerritory('Argentina')" />
          <path class="hitbox-path mode-50-only" d="M 1080 790 C 1180 840, 1160 890, 1120 860 Z" onclick="selectTerritory('Uruguay')" />
        </g>

        <!-- CAPA 4: OVERLAYS DE ETIQUETAS, BADGES Y FLECHA AUTORITATIVA DE ATAQUE -->
        <g id="layer-4-overlays">
          <!-- Etiquetas en Tercio Superior -->
          <text x="930" y="355" class="territory-label">Colombia</text>
          <text x="1090" y="375" class="territory-label mode-50-only">Venezuela</text>
          <text x="870" y="475" class="territory-label">Perú</text>
          <text x="1150" y="520" class="territory-label">Brasil</text>
          <text x="980" y="705" class="territory-label mode-50-only">Bolivia</text>
          <text x="820" y="740" class="territory-label">Chile</text>
          <text x="980" y="900" class="territory-label">Argentina</text>
          <text x="1130" y="825" class="territory-label mode-50-only">Uruguay</text>

          <!-- Badges de Ejércitos Circulares en Tercio Inferior -->
          <g class="badge-group">
            <circle cx="930" cy="405" r="30" class="badge-circle" stroke="#eab308" />
            <text x="930" y="416" class="badge-text">3</text>
          </g>
          <g class="badge-group mode-50-only">
            <circle cx="1090" cy="420" r="30" class="badge-circle" stroke="#06b6d4" />
            <text x="1090" y="431" class="badge-text">2</text>
          </g>
          <g class="badge-group">
            <circle cx="870" cy="555" r="30" class="badge-circle" stroke="#10b981" />
            <text x="870" y="566" class="badge-text">4</text>
          </g>
          <g class="badge-group">
            <circle cx="1150" cy="640" r="38" class="badge-circle" stroke="#3b82f6" />
            <text x="1150" y="652" class="badge-text">10</text>
          </g>
          <g class="badge-group mode-50-only">
            <circle cx="980" cy="765" r="30" class="badge-circle" stroke="#a855f7" />
            <text x="980" y="776" class="badge-text">2</text>
          </g>
          <g class="badge-group">
            <circle cx="820" cy="920" r="30" class="badge-circle" stroke="#eab308" />
            <text x="820" y="931" class="badge-text">5</text>
          </g>
          <g class="badge-group">
            <circle cx="980" cy="1040" r="44" class="badge-circle" stroke="#ef4444" />
            <text x="980" y="1054" class="badge-text">16</text>
          </g>
          <g class="badge-group mode-50-only">
            <circle cx="1130" cy="855" r="28" class="badge-circle" stroke="#10b981" />
            <text x="1130" y="865" class="badge-text">1</text>
          </g>

          <!-- Flecha Vectorial de Ataque: América del Sur (Argentina) ➔ África (Sáhara) -->
          <path id="attack-arrow" d="M 980 900 Q 1350 520, 1650 620" class="vector-arrow" />
        </g>
      </svg>
    </div>
  </div>

  <script>
    let currentState = 'all';

    function setProofState(state) {
      currentState = state;
      const labels = document.querySelectorAll('.territory-label');
      const badges = document.querySelectorAll('.badge-group');
      const arrow = document.getElementById('attack-arrow');
      const arg = document.getElementById('territory-south-america-argentina');
      const bra = document.getElementById('territory-south-america-brazil');
      const sah = document.getElementById('territory-africa-sahara');

      arg.classList.remove('terr-selected');
      bra.classList.remove('terr-target');
      sah.classList.remove('terr-target');

      document.querySelectorAll('.toolbar .btn').forEach(b => b.classList.remove('btn-active'));
      const activeBtn = document.getElementById(`btn-state-${state}`);
      if (activeBtn) activeBtn.classList.add('btn-active');

      switch(state) {
        case 'all':
          labels.forEach(l => l.classList.remove('hidden-labels'));
          badges.forEach(b => b.classList.remove('hidden-badges'));
          arrow.classList.remove('hidden-arrow');
          arg.classList.add('terr-selected');
          bra.classList.add('terr-target');
          break;

        case 'no-labels':
          labels.forEach(l => l.classList.add('hidden-labels'));
          badges.forEach(b => b.classList.add('hidden-badges'));
          arrow.classList.add('hidden-arrow');
          break;

        case 'selected':
          labels.forEach(l => l.classList.remove('hidden-labels'));
          badges.forEach(b => b.classList.remove('hidden-badges'));
          arg.classList.add('terr-selected');
          arrow.classList.add('hidden-arrow');
          break;

        case 'attackable':
          labels.forEach(l => l.classList.remove('hidden-labels'));
          badges.forEach(b => b.classList.remove('hidden-badges'));
          arg.classList.add('terr-selected');
          bra.classList.add('terr-target');
          sah.classList.add('terr-target');
          arrow.classList.add('hidden-arrow');
          break;

        case 'executing':
          labels.forEach(l => l.classList.remove('hidden-labels'));
          badges.forEach(b => b.classList.remove('hidden-badges'));
          arg.classList.add('terr-selected');
          sah.classList.add('terr-target');
          arrow.classList.remove('hidden-arrow');
          break;
      }
    }

    function toggleMode(mode) {
      const mode50Elems = document.querySelectorAll('.mode-50-only');
      if (mode === '26') {
        mode50Elems.forEach(el => el.style.display = 'none');
        document.getElementById('btn-mode-26').classList.add('btn-active');
        document.getElementById('btn-mode-50').classList.remove('btn-active');
      } else {
        mode50Elems.forEach(el => el.style.display = 'block');
        document.getElementById('btn-mode-50').classList.add('btn-active');
        document.getElementById('btn-mode-26').classList.remove('btn-active');
      }
    }

    function setResolution(res) {
      const container = document.getElementById('vp-container');
      const btn1920 = document.getElementById('btn-res-1920');
      const btn1366 = document.getElementById('btn-res-1366');

      if (res === '1366') {
        container.classList.add('mode-1366');
        btn1366.classList.add('btn-active');
        btn1920.classList.remove('btn-active');
      } else {
        container.classList.remove('mode-1366');
        btn1920.classList.add('btn-active');
        btn1366.classList.remove('btn-active');
      }
    }

    function selectTerritory(name) {
      console.log('Territorio clickeado:', name);
    }
  </script>
</body>
</html>
