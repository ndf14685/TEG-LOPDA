<!DOCTYPE html>

<head>

  <style>
    :root {
      --ocean-navy: #091b30;
      --bg-dark: #040a14;
      --text-main: #f8fafc;
      --border-gold: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #0f172a;
      border-bottom: 2px solid var(--border-gold);
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 20;
    }

    .brand-title {
      font-family: serif;
      font-size: 16px;
      font-weight: bold;
      color: #fbbf24;
      letter-spacing: 1.5px;
    }

    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

    .btn {
      background: linear-gradient(180deg, #334155, #1e293b);
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #475569; border-color: #fbbf24; }
    .btn-active { border-color: #fbbf24; background: #d97706; color: #000; }

    .map-viewport {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 50% 45%, #0f2b48 0%, #091b30 60%, #040a14 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
    }

    .viewport-container {
      width: 100%;
      height: 100%;
      max-width: 1920px;
      max-height: 1080px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .mode-1366 {
      max-width: 1366px;
      max-height: 768px;
      border: 2px stroke #3b82f6;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.4);
    }

    svg { width: 100%; height: 100%; position: absolute; inset: 0; }

    #svg-overlay { pointer-events: none; }
    #svg-overlay .territory-label, #svg-overlay .badge-group, #svg-overlay .vector-arrow { display: none !important; }
  </style>
</head>

      <stop offset="100%" stop-color="rgba(2, 132, 199, 0.05)" />

      .compass-ring { fill: none; stroke: rgba(251, 191, 36, 0.15); stroke-width: 1.5; }
    </style>
  </defs>

    </g>

    </g>

  </g>

  <script>
    function setViewMode(mode) {
      const wrapperBase = document.getElementById('wrapper-base');
      const wrapperOverlay = document.getElementById('wrapper-overlay');
      const btnBase = document.getElementById('btn-view-base');
      const btnOverlay = document.getElementById('btn-view-overlay');

      if (mode === 'overlay') {
        wrapperOverlay.style.display = 'block';
        btnOverlay.classList.add('btn-active');
        btnBase.classList.remove('btn-active');
      } else {
        wrapperOverlay.style.display = 'none';
        btnBase.classList.add('btn-active');
        btnOverlay.classList.remove('btn-active');
      }
    }

    function setResolution(res) {
      const container = document.getElementById('vp-container');
      const btn1920 = document.getElementById('btn-res-1920');
      const btn1366 = document.getElementById('btn-res-1366');

      if (res === '1366') {
        container.classList.add('mode-1366');
        btn1366.classList.add('btn-active');
        btn1920.classList.remove('btn-active');
      } else {
        container.classList.remove('mode-1366');
        btn1920.classList.add('btn-active');
        btn1366.classList.remove('btn-active');
      }
    }
  </script>
